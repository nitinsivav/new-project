<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Welcome Back</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your credentials to sign in</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>

                <div id="message" class="message hidden"></div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="loader hidden"></span>
                </button>
            </form>

            <p style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--muted);">
                Don't have an account? <a href="/register" style="color: var(--forest); font-weight: 600; text-decoration: none;">Create one here</a>
            </p>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
